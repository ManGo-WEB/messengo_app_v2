name: messengo

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-messengo}
      POSTGRES_DB: ${POSTGRES_DB:-messengo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    # Dev: порт БД публикуется только на localhost.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-messengo} -d ${POSTGRES_DB:-messengo}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
